<html lang="es-AR">
<head>
<meta charset="UTF-8">

<meta name="theme-color" content="#121212">
<title>Plantillas de marca | Gambeta Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;1,700;1,800;1,900&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{color-scheme:dark;--bg:#121212;--card:#1c1c1c;--card-2:#262626;--chalk:#ecebe4;--mute:#a4a49e;--acc:#00ff87;--warn:#ffc75a;--line:rgba(236,235,228,.14);--line-2:rgba(236,235,228,.28);
  --f-display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;--f-body:"Hanken Grotesk",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--chalk);font:400 1rem/1.5 var(--f-body);padding:20px 16px 60px}
.wrap{max-width:1100px;margin:0 auto}
h1{font:italic 900 clamp(2.4rem,8vw,3.6rem)/.95 var(--f-display);text-transform:uppercase}
.lead{color:var(--mute);margin:8px 0 22px;max-width:60ch}
.layout{display:grid;gap:24px}
@media(min-width:880px){.layout{grid-template-columns:380px 1fr;align-items:start}}
.panel{display:grid;gap:16px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:42px;padding:0 14px;border-radius:999px;border:1px solid var(--line-2);color:var(--chalk);font:600 .9rem var(--f-body);cursor:pointer;background:transparent}
.chip[aria-pressed="true"]{background:var(--chalk);color:#121212;border-color:var(--chalk)}
.field{display:grid;gap:6px}
.field label,.lbl{font-size:.88rem;font-weight:600}
input[type=text],textarea{width:100%;min-height:46px;padding:10px 12px;background:var(--bg);border:1px solid var(--line-2);border-radius:8px;color:var(--chalk);font:inherit}
textarea{min-height:84px;resize:vertical}
input:focus,textarea:focus{border-color:var(--acc);outline:0}
input[type=range]{width:100%;accent-color:#00ff87}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 20px;border-radius:8px;border:0;font:700 1rem var(--f-body);cursor:pointer}
.btn-primary{background:var(--acc);color:#0d0d0d}
.btn-line{background:transparent;color:var(--chalk);border:1px solid var(--line-2)}
.btn:focus-visible,.chip:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.hint{color:var(--mute);font-size:.84rem}
.photo-row{display:grid;gap:10px}
.preview-box{display:grid;justify-items:center;gap:12px}
.preview-frame{border:1px solid var(--line-2);border-radius:12px;overflow:hidden;background:#000;position:relative}
.scaler{transform-origin:0 0}
.note-ok{color:var(--acc);font-size:.9rem;min-height:1.3em}

/* ================== ESCENARIO (se exporta tal cual) ================== */
.stage{position:relative;overflow:hidden;background:#121212;color:#ecebe4;font-family:"Hanken Grotesk",system-ui,sans-serif;--acc:#00ff87}
.stage *{box-sizing:border-box;margin:0;padding:0}
.stage .bg{position:absolute;left:0;top:0;right:0;bottom:0;background:linear-gradient(120deg,rgba(0,255,135,.14) 0%,rgba(0,255,135,0) 45%),repeating-linear-gradient(115deg,rgba(255,255,255,0) 0,rgba(255,255,255,0) 70px,rgba(255,255,255,.028) 70px,rgba(255,255,255,.028) 140px)}
.stage .brand{position:absolute;display:flex;align-items:center;gap:18px}
.stage .brand svg{width:62px;height:95px;flex:none}
.stage .brand b{font:italic 900 54px/1 "Barlow Condensed","Arial Narrow",Impact,sans-serif;text-transform:uppercase;letter-spacing:.012em}
.stage .brand i{font:italic 800 24px/1 "Barlow Condensed",sans-serif;background:#00ff87;color:#0d0d0d;padding:7px 10px 5px;border-radius:4px;margin-left:12px;font-style:italic;text-transform:uppercase}
.stage .foot{position:absolute;text-align:center;color:#a4a49e;font:600 30px/1.3 "Hanken Grotesk",sans-serif}
.stage .foot b{color:#ecebe4;font-weight:700}
.stage .h{font-family:"Barlow Condensed","Arial Narrow",Impact,sans-serif;font-style:italic;font-weight:900;text-transform:uppercase;line-height:.9;letter-spacing:.01em}
.stage .acc{color:#00ff87}
.stage .tag{position:absolute;background:#00ff87;color:#0d0d0d;font:italic 900 52px/1 "Barlow Condensed",sans-serif;text-transform:uppercase;padding:16px 26px 12px;transform:skewX(-8deg);letter-spacing:.02em}
.stage .tag.warn{background:#ffc75a}
.stage .photo{position:absolute;overflow:hidden;background:#262626;border-radius:28px;border:2px solid rgba(236,235,228,.18)}
.stage .photo img{position:absolute;max-width:none}
.stage .photo .empty{position:absolute;left:0;top:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;color:#a4a49e;font:600 34px/1.3 "Hanken Grotesk",sans-serif;text-align:center;padding:40px}
.stage .wm{position:absolute;opacity:.07}
.stage .wm svg{width:100%;height:100%}
.stage .pill{display:inline-block;border:2px solid rgba(236,235,228,.4);border-radius:999px;padding:12px 28px;font:700 34px/1 "Hanken Grotesk",sans-serif}
</style>
</head>
<body>
<div class="wrap">
  <h1>Plantillas de marca</h1>
  <p class="lead">Elegí una plantilla, cambiá los textos, sumá tu foto real y descargá la imagen lista para subir a Instagram o para imprimir. Todo se arma en tu navegador: nada se sube a ningún lado.</p>

      </div>
      <div id="fields" style="display:grid;gap:14px"></div>
      <div class="photo-row" id="photoRow" hidden>
        <div class="field"><label for="photoFile" id="photoLbl">Foto</label><input type="file" id="photoFile" accept="image/*"></div>
        <div class="field"><label for="zoom">Zoom</label><input type="range" id="zoom" min="100" max="300" value="100"></div>
        <div class="field"><label for="px">Mover a los costados</label><input type="range" id="px" min="-100" max="100" value="0"></div>
        <div class="field"><label for="py">Mover arriba y abajo</label><input type="range" id="py" min="-100" max="100" value="0"></div>
      </div>
      <button class="btn btn-primary" id="download" type="button">Descargar imagen</button>
      <p class="note-ok" id="state" role="status" aria-live="polite"></p>
      <p class="hint" id="sizeHint"></p>
    </div>
    <div class="preview-box">
      <div class="preview-frame" id="frame"><div class="scaler" id="scaler"><div class="stage" id="stage"></div></div></div>
    </div>
  </div>
</div>

         '<div class="h acc" data-fit="760" style="position:absolute;left:70px;top:510px;font-size:140px;white-space:nowrap">al club'+(v.n&&v.n!=="Nombre"?', '+esc(v.n.split(" ")[0]):'.')+'</div>'+
         '<div style="position:absolute;right:70px;top:250px;width:520px;display:grid;gap:26px">'+
           '<div style="border:2px solid rgba(236,235,228,.28);border-radius:16px;padding:26px 30px"><div style="font:600 26px/1 Hanken Grotesk,sans-serif;color:#a4a49e;margin-bottom:10px">Tu código de pedido</div><div class="h acc" style="font-size:84px;line-height:1">'+esc(v.r)+'</div></div>'+
           '<div style="font:500 30px/1.45 Hanken Grotesk,sans-serif;color:#ecebe4">Seguí tu pedido en <b>'+URLTXT+'</b>: tocá Seguí tu pedido al final de la página e ingresá este código.</div>'+
           '<div style="font:500 30px/1.45 Hanken Grotesk,sans-serif;color:#a4a49e">Si te gustó, mandanos una foto con tu camiseta por WhatsApp y la compartimos.</div>'+
         '</div>'+
         '<div class="foot" style="left:70px;right:70px;top:880px;text-align:left;font-size:28px"><b>WhatsApp +54 9 2964 52-0101</b> · Para tener calidad, dentro y fuera de la cancha.</div>';
     }}
  ];

  var cur = TPL[0], vals = {}, photo = {img:null,nw:0,nh:0};

  function buildChips(){
    $("tplChips").innerHTML = TPL.map(function(t){ return '<button type="button" class="chip" data-id="'+t.id+'" aria-pressed="'+(t===cur)+'">'+esc(t.name)+'</button>'; }).join("");
    [].forEach.call($("tplChips").querySelectorAll(".chip"),function(b){ b.onclick = function(){ pick(b.getAttribute("data-id")); }; });
  }
  function buildFields(){
    $("fields").innerHTML = cur.fields.map(function(f){
      var big = f.k==="q" || f.k==="d";
      return '<div class="field"><label for="f_'+f.k+'">'+esc(f.l)+'</label>'+(big?'<textarea id="f_'+f.k+'" maxlength="140"></textarea>':'<input type="text" id="f_'+f.k+'" maxlength="60" autocomplete="off">')+'</div>';
    }).join("");
    cur.fields.forEach(function(f){ var el = $("f_"+f.k); el.value = vals[cur.id+f.k] != null ? vals[cur.id+f.k] : f.d; el.addEventListener("input",function(){ vals[cur.id+f.k] = el.value; draw(); }); });
    $("photoRow").hidden = !cur.photo; if(cur.photoLabel) $("photoLbl").textContent = cur.photoLabel;
  }
  function values(){ var v = {}; cur.fields.forEach(function(f){ var x = vals[cur.id+f.k]; v[f.k] = x != null ? x : f.d; }); return v; }

  function placePhoto(){
    var box = $("photoBox"); if(!box) return;
    var old = box.querySelector("img"); if(old) old.remove();
    if(!photo.img){ return; }
    var empty = box.querySelector(".empty"); if(empty) empty.style.display = "none";
    var bw = box.clientWidth || parseInt(box.style.width,10), bh = box.clientHeight || parseInt(box.style.height,10);
    var z = +$("zoom").value/100, sc = Math.max(bw/photo.nw, bh/photo.nh)*z, w = photo.nw*sc, h = photo.nh*sc;
    var ox = (w-bw)/2*(+$("px").value/100), oy = (h-bh)/2*(+$("py").value/100);
    var im = document.createElement("img"); im.src = photo.img; im.alt = "";
    im.style.width = w+"px"; im.style.height = h+"px"; im.style.left = ((bw-w)/2 - ox)+"px"; im.style.top = ((bh-h)/2 - oy)+"px";
    box.appendChild(im);
  }
  function fit(){
    var fw = Math.min($("frame").parentNode.clientWidth || 420, 520), s = Math.min(1, fw / cur.w);
    $("scaler").style.transform = "scale("+s+")";
    $("frame").style.width = (cur.w*s)+"px"; $("frame").style.height = (cur.h*s)+"px";
  }
  function draw(){
    var st = $("stage"); st.style.width = cur.w+"px"; st.style.height = cur.h+"px";
    st.innerHTML = cur.render(values());
    [].forEach.call(st.querySelectorAll("[data-fit]"),function(el){   // achica el texto si no entra en el ancho
      var max = +el.getAttribute("data-fit"), fs = parseFloat(el.style.fontSize), n = 0;
      while(el.offsetWidth > max && fs > 36 && n++ < 60){ fs *= .96; el.style.fontSize = fs+"px"; }
    });
    placePhoto(); fit();
    $("sizeHint").textContent = "Tamaño de la imagen: "+cur.w+" × "+cur.h+" px"+(cur.id==="tarjeta" ? " (para imprimir en 10 × 15 cm o similar)" : " (formato historia de Instagram)");
  }
  function pick(id){
    cur = TPL.filter(function(t){ return t.id===id; })[0]; $("state").textContent = "";
    buildChips(); buildFields(); draw();
  }

  $("photoFile").addEventListener("change",function(){
    var f = this.files && this.files[0]; if(!f) return;
    var url = URL.createObjectURL(f), im = new Image();
    im.onload = function(){ photo = {img:url,nw:im.naturalWidth,nh:im.naturalHeight}; $("zoom").value = 100; $("px").value = 0; $("py").value = 0; placePhoto(); };
    im.onerror = function(){ $("state").textContent = "No se pudo leer esa foto."; };
    im.src = url;
  });
  ["zoom","px","py"].forEach(function(id){ $(id).addEventListener("input",placePhoto); });
  window.addEventListener("resize",fit);

  $("download").addEventListener("click",function(){
    if(!window.html2canvas){ $("state").textContent = "No se pudo cargar la librería de imágenes. Revisá tu conexión."; return; }
    var btn = this; btn.disabled = true; $("state").textContent = "Generando imagen…";
    (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(function(){
      return window.html2canvas($("stage"),{scale:1,width:cur.w,height:cur.h,backgroundColor:"#121212",useCORS:true,logging:false,
        onclone:function(doc){ var sc = doc.getElementById("scaler"); sc.style.transform = "none"; doc.getElementById("frame").style.width = cur.w+"px"; doc.getElementById("frame").style.height = cur.h+"px"; }});
    }).then(function(cv){
      var a = document.createElement("a"); a.download = "gambeta-"+cur.id+".png"; a.href = cv.toDataURL("image/png"); document.body.appendChild(a); a.click(); a.remove();
      $("state").textContent = "Listo. La imagen se descargó.";
    }).catch(function(e){ $("state").textContent = "No se pudo generar la imagen. Probá de nuevo."; }).then(function(){ btn.disabled = false; });
  });

  buildChips(); buildFields(); draw();
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(draw);
})();
</script>
</body>
</html>
